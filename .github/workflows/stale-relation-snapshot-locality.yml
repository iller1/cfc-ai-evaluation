name: Stale relation snapshot locality review

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run stale relation snapshot locality review
        run: python -m research.review_stale_relation_snapshot_locality
      - name: Upload snapshot locality result
        uses: actions/upload-artifact@v4
        with:
          name: stale-relation-snapshot-locality
          path: stale_relation_snapshot_locality.json
