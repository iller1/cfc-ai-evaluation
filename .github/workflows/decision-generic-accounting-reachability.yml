name: Decision generic accounting reachability

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Review public accounting draft reachability
        run: python -m research.review_decision_generic_accounting_reachability
      - name: Upload reachability result
        uses: actions/upload-artifact@v4
        with:
          name: decision-generic-accounting-reachability
          path: decision_generic_accounting_reachability.json
