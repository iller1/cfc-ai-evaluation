name: Structured state-space research

on:
  push:
    branches:
      - research/structured-input-metamorphic-rules
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-space:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static state-space tests
        run: python -m unittest research.test_structured_input_state_space -v
      - name: Execute all admissible states against frozen CFC
        run: python -m research.run_structured_state_space_against_frozen
      - name: Upload full result
        uses: actions/upload-artifact@v4
        with:
          name: structured-state-space-results
          path: structured_state_space_results.json
