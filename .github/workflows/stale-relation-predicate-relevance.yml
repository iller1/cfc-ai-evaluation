name: Stale relation predicate relevance review

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run stale relation predicate relevance review
        run: python -m research.review_stale_relation_predicate_relevance
      - name: Upload predicate relevance result
        uses: actions/upload-artifact@v4
        with:
          name: stale-relation-predicate-relevance
          path: stale_relation_predicate_relevance.json
