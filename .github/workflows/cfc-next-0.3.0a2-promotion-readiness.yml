name: CFC-next 0.3.0a2 promotion readiness

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run 0.3.0a2 acceptance matrix
        run: python -m research.review_cfc_next_0_3_0a2_acceptance
      - name: Run 0.3.0a2 promotion readiness
        run: python -m research.review_cfc_next_0_3_0a2_promotion_readiness
      - name: Upload 0.3.0a2 results
        uses: actions/upload-artifact@v4
        with:
          name: cfc-next-0.3.0a2-readiness
          path: |
            cfc_next_0_3_0a2_acceptance.json
            cfc_next_0_3_0a2_promotion_readiness.json
