name: Decision support closure path inspection

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect decision support closure path
        run: python -m research.inspect_decision_support_closure_path
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: decision-support-closure-path
          path: decision_support_closure_path.json
