name: CFC-next 0.3.0a2 accounting lifecycle

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run full accounting lifecycle matrix
        run: |
          python -m research.review_cfc_next_0_3_0a2_accounting_lifecycle
      - name: Upload lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: cfc-next-0.3.0a2-accounting-lifecycle
          path: cfc_next_0_3_0a2_accounting_lifecycle.json
