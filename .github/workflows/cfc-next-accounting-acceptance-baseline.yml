name: CFC-next accounting acceptance baseline

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run frozen-reference acceptance baseline
        run: python -m research.review_cfc_next_accounting_acceptance_baseline
      - name: Upload acceptance baseline
        uses: actions/upload-artifact@v4
        with:
          name: cfc-next-accounting-acceptance-baseline
          path: cfc_next_accounting_acceptance_baseline.json
