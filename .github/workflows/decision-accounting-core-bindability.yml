name: Decision accounting core bindability

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run core bindability probe
        run: python -m research.review_decision_accounting_core_bindability
      - name: Upload bindability result
        uses: actions/upload-artifact@v4
        with:
          name: decision-accounting-core-bindability
          path: decision_accounting_core_bindability.json
