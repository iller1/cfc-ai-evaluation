name: CFC-next 0.3.0a1 candidate acceptance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run CFC-next positive and negative acceptance matrix
        run: python -m research.review_cfc_next_candidate_acceptance
      - name: Upload candidate acceptance
        uses: actions/upload-artifact@v4
        with:
          name: cfc-next-0.3.0a1-candidate-acceptance
          path: cfc_next_candidate_acceptance.json
