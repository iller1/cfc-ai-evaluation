name: Decision obligation schema compatibility

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run obligation schema compatibility review
        run: python -m research.review_decision_obligation_schema_compatibility
      - name: Upload schema result
        uses: actions/upload-artifact@v4
        with:
          name: decision-obligation-schema-compatibility
          path: decision_obligation_schema_compatibility.json
