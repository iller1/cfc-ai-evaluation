name: Demonstrator v1.1 UX validation

on:
  push:
    branches:
      - demonstrator-v1.1-ux
  pull_request:
    paths:
      - 'demonstrator/**'
      - '.github/workflows/demonstrator-v1.1-ux.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate v1.1 UX candidate
        run: python demonstrator/verify_v1_1_ux.py
