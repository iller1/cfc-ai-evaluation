name: Frozen public API multi-scope contract inspection

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect frozen public API contract
        run: python -m research.inspect_frozen_public_api_multi_scope
      - name: Upload API contract inspection
        uses: actions/upload-artifact@v4
        with:
          name: frozen-public-api-multi-scope-contract
          path: frozen_public_api_multi_scope_contract.json
