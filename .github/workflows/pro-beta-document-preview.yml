name: Pro Beta document preview

on:
  pull_request:
    paths:
      - "pro_beta/**"
      - "pro_beta_frontend/**"
      - ".github/workflows/pro-beta-document-preview.yml"
  push:
    branches: [main]
    paths:
      - "pro_beta/**"
      - "pro_beta_frontend/**"
      - ".github/workflows/pro-beta-document-preview.yml"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install bounded document parsers
        run: python -m pip install "pypdf==6.18.1" "defusedxml==0.7.1"
      - name: JavaScript syntax
        run: node --check pro_beta_frontend/app.js
      - name: Document extraction, access control, HTTP and frontend tests
        run: python -m unittest -v pro_beta.test_document_extract pro_beta.test_http_server pro_beta_frontend.test_frontend
