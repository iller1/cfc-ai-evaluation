name: CFC-RIDI F3 Suite R1

on:
  push:
    branches:
      - review/cfc-ridi-v0.2-f3-suite-r1
    paths:
      - "collaboration/cfc-ridi/v0.2/f3_suite/**"
      - ".github/workflows/cfc-ridi-f3-suite-r1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen F2 artifact identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < collaboration/cfc-ridi/v0.2/f2_adapter_v0.2/adapter.py)" -eq 30630
          echo "15b7d01787237b2e5f0d1ca106c4e84aaf1976a2512179c79c458fe3d80e634b  collaboration/cfc-ridi/v0.2/f2_adapter_v0.2/adapter.py" | sha256sum -c -
          test "$(wc -c < collaboration/cfc-ridi/v0.2/f2_adapter_v0.2/test_adapter.py)" -eq 8853
          echo "3798cfb0b9c79311cb74b4bd5be71c2805ff225d316a57f2fb55c2d8462fd732  collaboration/cfc-ridi/v0.2/f2_adapter_v0.2/test_adapter.py" | sha256sum -c -
          test "$(wc -c < collaboration/cfc-ridi/v0.2/f2_adapter_v0.2/README.md)" -eq 3891
          echo "0c441a05b75c62b827c69c0d40a83d7ede02b66d40b757156e3ddcec4d070ba7  collaboration/cfc-ridi/v0.2/f2_adapter_v0.2/README.md" | sha256sum -c -
          test "$(wc -c < collaboration/cfc-ridi/v0.2/f2_adapter_v0.2/ADAPTER_MANIFEST.json)" -eq 2125
          echo "6e56866ac5d6ee7eddc82a06d8c172cb886d38d98f2e7fa1fa76d3afa03aa264  collaboration/cfc-ridi/v0.2/f2_adapter_v0.2/ADAPTER_MANIFEST.json" | sha256sum -c -
          echo "b3b1f11e060289afa4e7da61072f2c31be7f0da1786be90682ec307d4e1f5303  demonstrator/cfc_anchor-0.2.90rc1-py3-none-any.whl" | sha256sum -c -

      - name: Install exact frozen Anchor wheel
        run: python -m pip install --no-deps demonstrator/cfc_anchor-0.2.90rc1-py3-none-any.whl

      - name: Reproduce F2 representation baseline
        run: python collaboration/cfc-ridi/v0.2/f2_adapter_v0.2/test_adapter.py

      - name: Run F3 T01-T15
        id: f3
        continue-on-error: true
        run: |
          python collaboration/cfc-ridi/v0.2/f3_suite/run_f3.py             --output collaboration/cfc-ridi/v0.2/f3_suite/F3_RESULTS.json

      - name: Show complete F3 result
        if: always()
        run: cat collaboration/cfc-ridi/v0.2/f3_suite/F3_RESULTS.json

      - name: Upload F3 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfc-ridi-f3-r1-result
          path: collaboration/cfc-ridi/v0.2/f3_suite/F3_RESULTS.json
          if-no-files-found: error

      - name: Preserve suite outcome
        if: steps.f3.outcome == 'failure'
        run: exit 1
