name: CFC-next accounting repair surface

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect frozen accounting repair surface
        run: python -m research.review_cfc_next_accounting_repair_surface
      - name: Validate repair spec consistency
        run: python -m research.review_cfc_next_repair_spec_consistency
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: cfc-next-accounting-repair-surface
          path: |
            cfc_next_accounting_repair_surface.json
            cfc_next_repair_spec_consistency.json
