name: Support threshold reversal review

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run minimal support-threshold pair review
        run: python -m research.review_support_threshold_reversal
      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: support-threshold-reversal-review
          path: support_threshold_reversal_review.json
