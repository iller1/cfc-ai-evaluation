name: CFC-next accounting repair readiness

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repair readiness chain
        run: python -m research.review_cfc_next_accounting_repair_readiness
      - name: Upload readiness result
        uses: actions/upload-artifact@v4
        with:
          name: cfc-next-accounting-repair-readiness
          path: cfc_next_accounting_repair_readiness.json
