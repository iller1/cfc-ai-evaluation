name: CFC-next 0.3.0a2 freeze review

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run CFC-next 0.3.0a2 freeze review
        run: python -m research.review_cfc_next_0_3_0a2_freeze_review
      - name: Upload freeze-review evidence
        uses: actions/upload-artifact@v4
        with:
          name: cfc-next-0.3.0a2-freeze-review
          path: cfc_next_0_3_0a2_freeze_review.json
