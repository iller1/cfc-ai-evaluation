name: Pro Beta contracts

on:
  push:
    branches:
      - pro-beta-v0.1
    paths:
      - "pro_beta/**"
      - ".github/workflows/pro-beta-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Pro Beta contract and persistence tests
        run: python -m unittest -v pro_beta.test_contracts pro_beta.test_persistence
