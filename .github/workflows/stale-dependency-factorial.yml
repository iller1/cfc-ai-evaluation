name: Stale dependency factorial

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run 16-state stale dependency factorial
        run: python -m research.review_stale_dependency_factorial
      - name: Upload factorial result
        uses: actions/upload-artifact@v4
        with:
          name: stale-dependency-factorial
          path: stale_dependency_factorial.json
