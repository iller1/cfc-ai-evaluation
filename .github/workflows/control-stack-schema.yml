name: Control Stack schema v0.1

on:
  pull_request:
    paths:
      - "control_stack/**"
      - ".github/workflows/control-stack-schema.yml"
  push:
    branches:
      - main
    paths:
      - "control_stack/**"
      - ".github/workflows/control-stack-schema.yml"

jobs:
  schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Control Stack contract
        run: python -m compileall -q control_stack
      - name: Run Control Stack schema acceptance
        run: python -m unittest -v control_stack.test_control_stack_schema
