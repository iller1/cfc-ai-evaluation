<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CFC + HAWM Pro Beta</title>
  <style>
    :root { font-family: Inter, system-ui, Arial, sans-serif; color-scheme: dark; }
    body { margin:0; min-height:100vh; background:#111827; color:#f9fafb; display:grid; place-items:center; }
    main { width:min(760px,92vw); background:#1f2937; border:1px solid #374151; border-radius:18px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.28); }
    h1 { margin:0 0 8px; font-size:28px; }
    p { color:#cbd5e1; line-height:1.5; }
    .boundary { margin:18px 0; padding:12px 14px; border-radius:10px; background:#0f172a; font-family:ui-monospace,monospace; font-size:13px; }
    #auth { margin-top:22px; min-height:240px; }
    .error { color:#fca5a5; }
  </style>
</head>
<body>
  <main>
    <h1>CFC + HAWM Pro Beta</h1>
    <p>Private beta sign-in. HAWM stores working state; CFC remains a separate closure-control path.</p>
    <div class="boundary">Ordinary model replies: MODEL_REPLY_UNCHECKED / CFC NOT_CONNECTED_C2</div>
    <div id="auth">Loading authentication…</div>
  </main>

  <script>
    window.PRO_BETA_CLERK_KEY = "__CLERK_PUBLISHABLE_KEY__";
    window.PRO_BETA_CLERK_READY = __CLERK_READY__;
  </script>
  <script
    defer
    crossorigin="anonymous"
    src="https://alert-bear-8010.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
    type="text/javascript"
  ></script>
  <script
    defer
    crossorigin="anonymous"
    data-clerk-publishable-key="__CLERK_PUBLISHABLE_KEY__"
    src="https://alert-bear-8010.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
  <script>
    window.addEventListener("load", async function () {
      const target = document.getElementById("auth");
      if (!window.PRO_BETA_CLERK_READY) {
        target.innerHTML = '<p class="error">Authentication is not configured yet.</p>';
        return;
      }
      try {
        await Clerk.load({
          ui: { ClerkUI: window.__internal_ClerkUICtor },
        });
        target.innerHTML = "";
        if (Clerk.isSignedIn) {
          target.innerHTML = "<p>Signed in.</p><div id='user-button'></div>";
          Clerk.mountUserButton(document.getElementById("user-button"));
        } else {
          target.innerHTML = "<div id='sign-in'></div>";
          Clerk.mountSignIn(document.getElementById("sign-in"));
        }
      } catch (error) {
        target.innerHTML = '<p class="error">Authentication failed to initialize.</p>';
      }
    });
  </script>
</body>
</html>
